<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanaq — учёт для точки</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("coffeeos-theme");
          if (t !== "dark" && t !== "light") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.dataset.theme = t;

          var loc = localStorage.getItem("sanaq-locale");
          var lang = "ru";
          if (loc === "ru" || loc === "en" || loc === "kk") lang = loc;
          else if (loc !== "auto" && loc != null) lang = "ru";
          else {
            var tags = (navigator.languages || [navigator.language || ""]).map(function (x) {
              return String(x).toLowerCase().split("-")[0];
            });
            for (var i = 0; i < tags.length; i++) {
              if (tags[i] === "kk" || tags[i] === "kz") { lang = "kk"; break; }
              if (tags[i] === "ru") { lang = "ru"; break; }
              if (tags[i] === "en") { lang = "en"; break; }
            }
          }
          document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@500;600&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
