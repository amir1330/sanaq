services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: coffeeos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffeeos"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - coffee-internal

  backend:
    image: ghcr.io/amir1330/sanaq/backend:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://coffee:${POSTGRES_PASSWORD}@postgres:5432/coffeeos
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: https://sanaq.abuyunus.cc,https://coffee.abuyunus.cc
      WEB_CONCURRENCY: "2"
      SEED_DEMO: "0"
      WEBKASSA_URL: ${WEBKASSA_URL:-https://kkm.webkassa.kz}
      WEBKASSA_API_KEY: ${WEBKASSA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    networks:
      - coffee-internal

  nginx:
    image: ghcr.io/amir1330/sanaq/nginx:latest
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
      - coffee-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.sanaq.rule=Host(`sanaq.abuyunus.cc`) || Host(`coffee.abuyunus.cc`)"
      - "traefik.http.routers.sanaq.entrypoints=websecure"
      - "traefik.http.routers.sanaq.tls=true"
      - "traefik.http.services.sanaq.loadbalancer.server.port=80"

networks:
  web:
    external: true
  coffee-internal:

volumes:
  postgres_data:
  uploads:
