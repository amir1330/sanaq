name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set image prefix
        id: meta
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/backend:latest

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.prefix }}/nginx:latest

      - name: Trigger deploy
        run: |
          echo "Triggering deploy on ${{ secrets.VPS_HOST }}:9002 ..."
          for i in 1 2 3; do
            status=$(curl -s --fail -o /dev/null -w "%{http_code}" --max-time 30 -X POST \
              "http://${{ secrets.VPS_HOST }}:9002/hooks/deploy" \
              -H "Content-Type: application/json" \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")
            echo "Attempt $i: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Deploy trigger failed after 3 attempts. Is the webhook listening on port 9002?"
          exit 1
