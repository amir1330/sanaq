name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test backend
        run: |
          docker build -t sanaq-backend-test ./backend
          docker run --rm sanaq-backend-test pytest -q

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend smoke tests
        working-directory: frontend
        run: npm test

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Image prefix
        id: meta
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/backend:latest
            ${{ steps.meta.outputs.prefix }}/backend:${{ github.sha }}

      - name: Build and push nginx
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}/nginx:latest
            ${{ steps.meta.outputs.prefix }}/nginx:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: sanaq-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Hardened path: non-root user + forced-command key.
      # stdin protocol: GHCR_USER\nGHCR_TOKEN\n + tar(cz) of compose/scripts
      # remote forced command: sync-deploy → ci-entry.sh
      - name: Sync and recreate over restricted SSH
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null "${RUNNER_TEMP}/deploy_key"
          printf '%s\n' "$SSH_KEY" > "${RUNNER_TEMP}/deploy_key"
          {
            printf '%s\n' "$GHCR_USER"
            printf '%s\n' "$GHCR_TOKEN"
            tar czf - docker-compose.prod.yml deploy/remote.sh deploy/ci-entry.sh
          } | ssh -i "${RUNNER_TEMP}/deploy_key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile=.github/known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "${USERNAME}@${HOST}" sync-deploy
