name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test backend
        run: |
          docker build -t coffeeos-backend-test ./backend
          docker run --rm coffeeos-backend-test pytest -q
